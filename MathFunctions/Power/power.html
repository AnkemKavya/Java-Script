<!DOCTYPE html>
<html>
    <head>
        <title>Power</title>
        <script src="power.js"></script>
    </head>
    <body>
        <h1>Static Power</h1>
        <button id="btnPower" onclick="onClickStaticPower()">Check</button>
        <p id="pResult"></p>

        <h1>Dynamic Power</h1>
        <label for="lblNumber">Number</label>

        <input type="number" id="txtPower" placeholder="Enter a number">
        <button id="btnCheck" onclick="onClickDynamicPower()">Check</button>
        <p id="pResults"></p>
    </body>
</html>
