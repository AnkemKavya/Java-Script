<!DOCTYPE html>
<html>
    <head>
        <title>Price</title>
        <script src="price.js"></script>
        <link rel="stylesheet" href="../style.css">
    </head>
    <body>
        <div class="numberDataType">
        <label for="lblPrice">Chocolate Price</label>
        <input type="number" id="chocolatePrice" placeholder="Enter the Chocolate price"><br>
        <label for="lblQuantity">Box Quantity</label>
        <input type="number" id="boxQuantity" placeholder="Enter the Quantity"><br>
        <label for="lblNoOfBoxes">No.Of.Boxes</label>
        <input type="number" id="noOfBoxes" placeholder="Enter No.Of.Boxes"><br>
        <label for="lblTravel">Travel Expences</label>
        <input type="number" id="travelExpences" placeholder="Enter the Travel Expences"><br>
        <label for="lblNewPrice">New Chocolate Price</label>
        <input type="number" id="NewChocolatePrice" placeholder="Enter the New Chocolate price"><br>
        <button id="btnResult" onclick="onClickBox()">Result</button>
    </div>
    </body>
</html>
